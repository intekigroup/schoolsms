<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Shule SMS</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f6f8fa; color: #16202a;
  }
  @media (prefers-color-scheme: dark) { body { background: #0e1519; color: #e6edf2; } .card { background: #16212a !important; border-color: #26343d !important; } }
  .card { max-width: 26rem; text-align: center; background: #fff; border: 1px solid #dde4ea; border-radius: 12px; padding: 2rem 1.75rem; }
  h1 { font-size: 1.3rem; margin: 0 0 .5rem; }
  p { margin: 0 0 1.25rem; opacity: .75; }
  button { font: inherit; font-weight: 600; padding: .6rem 1.2rem; border: 0; border-radius: 8px; background: #0b6f94; color: #fff; cursor: pointer; }
  button:focus-visible { outline: 2px solid #0b6f94; outline-offset: 2px; }
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>Shule SMS needs a connection to show live school records. Your work is not lost — reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
