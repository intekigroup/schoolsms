name: check

# Every push and pull request: type-check and validate the schema.
# Deployment is pull-based: the production server runs deploy/autodeploy.sh from cron,
# which deploys a new main commit once this "check" job is green for it. No secrets needed.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Same toolchain as deploy/Dockerfile: Yarn 1 via corepack, lockfile respected.
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      # Prisma reads DATABASE_URL from the schema even for validate/generate; any well-formed value will do.
      - run: yarn prisma validate && yarn prisma generate
        env: { DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci" }
      - run: yarn tsc --noEmit -p .
