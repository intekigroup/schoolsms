name: Check and deploy

# Every push to main: type-check and validate the schema, then deploy to the
# production server over SSH by running deploy/deploy.sh there.
#
# Repository secrets to add (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY   private key whose public half is in the server's ~/.ssh/authorized_keys
#   DEPLOY_HOST      169.58.3.24
#   DEPLOY_PORT      2024
#   DEPLOY_USER      inteki

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx tsc --noEmit -p .

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 25m
          script: ~/shule/deploy/deploy.sh main
